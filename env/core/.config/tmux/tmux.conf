# ==========================================
# 1. GENERAL SETTINGS
# ==========================================

# Prefix
unbind C-b
set -g prefix C-b

# Core behaviour
set -g default-shell $SHELL
set -s escape-time 0                  # zero-out escape time delay for neovim
set -g detach-on-destroy off          # don't exit tmux when closing a session
set -g display-time 4000              # increase message display duration
set -g status-interval 5              # refresh status bar more often
set -g focus-events on                # focus events for terminals that support them
setw -g aggressive-resize on          # useful for grouped sessions/multi-monitor

# ==========================================
# 2. DISPLAY & COLORS (TokyoNight)
# ==========================================

# True color support (Crucial for Neovim themes)
set -ga terminal-overrides ",xterm-256color*:Tc"

# Theme definitions
set -g mode-style "fg=#7aa2f7,bg=#3b4261"
set -g message-style "fg=#7aa2f7,bg=#3b4261"
set -g message-command-style "fg=#7aa2f7,bg=#3b4261"
set -g pane-border-style "fg=#3b4261"
set -g pane-active-border-style "fg=#7aa2f7"

# Status Bar Configuration
set -g status "on"
set -g status-justify centre
set -g status-style "fg=#7aa2f7,bg=#16161e"
set -g status-left-length 50
set -g status-left "  [#S|#(tmux ls | wc -l)] "
set -g status-right " #(date '+%H:%M') "

# Window Status
setw -g window-status-activity-style "underscore,fg=#a9b1d6,bg=#16161e"

# ==========================================
# 3. NAVIGATION & KEYBINDINGS
# ==========================================

# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display-message "config reloaded!"

# Split panes using relative paths
bind c new-window -c '#{pane_current_path}'
bind % split-window -h -c '#{pane_current_path}'
bind '"' split-window -v -c '#{pane_current_path}'

# Resize panes (Shift + Arrows)
bind -n S-Left resize-pane -L 2
bind -n S-Right resize-pane -R 2
bind -n S-Down resize-pane -D 1
bind -n S-Up resize-pane -U 1

# Kill session with confirmation
bind X confirm-before -p "Kill #S (y/n)?" "run-shell 'tmux switch-client -n \\\; kill-session -t \"#S\"'"

# Map Ctrl-Backspace
bind -n Bspace send-keys C-?

# ==========================================
# 4. VI COPY MODE
# ==========================================

setw -g mode-keys vi

bind -T copy-mode-vi 'v' send -X begin-selection
bind -T copy-mode-vi 'y' send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel
# Standard vim binding for visual block (rectangle) is Ctrl-v, not V
bind -T copy-mode-vi 'C-v' send -X rectangle-toggle

# ==========================================
# 5. CUSTOM SCRIPTS & WORKFLOWS
# ==========================================

# Windowizer
bind -r g run-shell "~/.local/bin/tmux-windowizer ~/Vault/"

# Cheatsheet
bind -r i run-shell "tmux neww ~/.dots/.config/tmux/tmux-cht.sh"

# Obsidian Today (Opens if not already open)
bind -r T if-shell "tmux selectw -t 'today'" "" "neww -n 'today' -c '#{pane_current_path}' 'nvim -c \':ObsidianToday\' ~/Vault/Vault.md'"

# ==========================================
# 6. PLUGINS
# ==========================================

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-pain-control'

# Plugin configs
set -g @resurrect-save 'S'
set -g @resurrect-restore 'R'

# Initialize TPM (Keep at the very bottom)
run '~/.config/tmux/plugins/tpm/tpm'
