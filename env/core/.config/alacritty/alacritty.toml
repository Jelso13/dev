[window]
# Slight transparency (1.0 is fully opaque, 0.0 is invisible)
opacity = 0.85
blur=true

[font]
size = 7

[font.normal]
family = "Roboto Mono Nerd Font"
style = "Regular"

[font.bold]
family = "Roboto Mono Nerd Font"
style = "Bold"

[font.italic]
family = "Roboto Mono Nerd Font"
style = "Italic"


