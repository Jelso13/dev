# env/gui/.config/picom/picom.conf

# --- Backend & Performance ---
backend = "glx";
glx-copy-from-front = false;
use-damage = true;
vsync = true; # Eliminates screen tearing

# --- Shadows ---
shadow = true;
shadow-radius = 12;
shadow-offset-x = -12;
shadow-offset-y = -12;
shadow-opacity = 0.5;
# Don't draw shadows on hidden/floating UI elements
shadow-exclude = [
    "class_g = 'Polybar'",
    "class_g = 'Rofi'",
    "_GTK_FRAME_EXTENTS@"
];

# --- Fading (Workspace Transitions) ---
fading = true;
fade-delta = 5;
fade-in-step = 0.03;
fade-out-step = 0.03;

# --- Transparency / Opacity ---
inactive-opacity = 0.85;
active-opacity = 0.8;
frame-opacity = 1.0;
inactive-opacity-override = false;
# Keep media and browsers fully opaque
opacity-rule = [
    "100:class_g = 'firefox'",
    "100:class_g = 'mpv'",
    "100:class_g = 'Zathura'"
];

# --- Blur ---
# dual_kawase is the modern, highly performant frosted-glass blur algorithm
blur-method = "dual_kawase";
blur-strength = 6; # Adjust from 1 to 20 depending on how frosted you want it

blur-background = true;
blur-background-frame = false;
blur-background-fixed = false;

# Do not blur the screen behind UI elements or menus
blur-background-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'",
    "_GTK_FRAME_EXTENTS@",
    "class_g = 'slop'" # Exclude screen selection tools like maim/scrot
];
